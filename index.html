<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RSSH</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // HarmonyOS ArkWeb: window.localStorage is null under the custom
      // tauri://localhost scheme. The AI store reads localStorage at module
      // load, so this must run as an inline classic script BEFORE any ES
      // module (module imports are hoisted and would win the race). In-memory
      // fallback only — persisted data lives in SQLite, not here.
      if (typeof window !== "undefined" && !window.localStorage) {
        var __rsshLs = new Map();
        Object.defineProperty(window, "localStorage", {
          value: {
            getItem: function (k) { return __rsshLs.has(String(k)) ? __rsshLs.get(String(k)) : null; },
            setItem: function (k, v) { __rsshLs.set(String(k), String(v)); },
            removeItem: function (k) { __rsshLs.delete(String(k)); },
            clear: function () { __rsshLs.clear(); },
            key: function (i) { return Array.from(__rsshLs.keys())[i] ?? null; },
            get length() { return __rsshLs.size; },
          },
          configurable: true,
          writable: true,
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
