[package]
name = "rssh"
version = "0.0.1"
edition = "2021"
default-run = "rssh"

[lib]
name = "rssh_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
# Pinned exact: [patch.crates-io] below swaps this precise version for the
# OHOS fork build. A loose "2" would let a newer crates.io release bypass it.
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Same pinning rule as tauri-build (fork base is 2.11.5).
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# `Include` glob expansion when reading ~/.ssh/config (issue #96)
glob = "0.3"
log = "0.4"
env_logger = "0.11"

# SSH — 0.49+ merged russh-keys into russh::keys. RSA server-sig-algs
# support via PrivateKeyWithHashAlg + best_supported_rsa_hash().
# 0.62.7 closes CVE-2026-48110 (GHSA-4r3c-5hpg-58qr, issue #235). It
# pins ssh-key itself and states its own RustCrypto requirements, which
# resolve against stable pkcs5/pkcs8/ed25519 now — the 0.60-era local
# exact-pins are gone with it.
russh = "0.62.7"
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "rt", "process", "time"] }
async-trait = "0.1"

# headless ws server (optional; enabled by `--features server`)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"], optional = true }
# embeds the built frontend (../dist) into the server binary so it's self-contained
include_dir = { version = "0.7", optional = true }

# SFTP
russh-sftp = "2"

# Plugin packages are user-supplied zips (manifest.json + index.html + assets).
# Default features on: accept any standard compression a packager might emit.
zip = "2"

# HTTP + crypto
base64 = "0.22"
# 配置备份/同步走 Argon2id（KDF）+ ChaCha20-Poly1305（AEAD），
# 标准 RustCrypto 实现；不再手搓。getrandom 用于生成 salt + nonce。
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
sha2 = "0.10"
# 进程内 passphrase 缓存的内存清零保护（drop 时擦写底层字节）
zeroize = { version = "1", features = ["derive"] }
regex = "1"
# regex 的伴生 crate（已在依赖树里）。用于 save 时拒绝零宽匹配的脱敏规则
# （minimum_len()==0 → 会在每个位置 replace → 灾难性 over-replacement）。
regex-syntax = "0.8"
futures-util = "0.3"
html2md = "0.2.15"

# CLI（optional，靠 --features cli 启用）
clap = { version = "4", features = ["derive"], optional = true }
clap_complete = { version = "4", features = ["unstable-dynamic"], optional = true }
rpassword = { version = "7", optional = true }
tempfile = { version = "3", optional = true }
tree-sitter = "0.26.9"
tree-sitter-bash = "0.25.1"
fontdb = "0.23.0"
url = "2.5.8"

# Mobile reqwest carries webpki-roots so TLS works without a probeable
# system trust store; OHOS rides the same table (ArkWeb devices have no
# openssl-style cert probing rustls-native-certs can rely on).
[target.'cfg(any(target_os = "android", target_os = "ios", target_env = "ohos"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream", "system-proxy"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_env = "ohos")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "system-proxy"] }

# Raw termios access for the serial `xany` (IXANY) flag — the serialport crate
# doesn't expose it. Only the Unix desktop targets compile the serial module.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

# PTY, serial and clipboard — the three desktop targets RSSH actually ships.
# Cargo target tables cannot use Tauri's `desktop` cfg alias, so keep this as a
# positive OS list instead of treating every non-mobile target as a desktop.
# OHOS is target_os = "linux" but links none of this (libudev/PTY have no
# place on a phone), so it is carved out explicitly.
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos"))))'.dependencies]
portable-pty = "0.8"
# Serial console transport — a 3rd byte-stream alongside SSH/PTY. macOS uses
# IOKit and Windows uses the Win32 API (no extra system dep); Linux links
# libudev for port enumeration, so Linux CI/packaging needs `libudev-dev` at
# build time (see build-linux.sh).
serialport = "4.9.0"
arboard = "3"

# Keychain — Apple platforms share the native Security.framework backend.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# ── OHOS (HarmonyOS) ──
# napi bridge: the fork's mobile_entry_point expansion needs it on ohos.
[target.'cfg(target_env = "ohos")'.dependencies]
napi-derive-ohos = "1.1"
napi-ohos = { version = "1.1", features = ["napi8"] }

# Official plugins (opener/dialog/fs) have no OHOS implementation upstream or
# in the fork — compiling their desktop Linux backends (rfd etc.) against the
# OHOS sysroot would not link. Everything but ohos keeps them; the ohos build
# registers no plugins and frontend save/pick paths degrade until phase D.
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", not(target_env = "ohos")), target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
default = []
cli = ["clap", "clap_complete", "rpassword", "tempfile"]
server = ["dep:tokio-tungstenite", "dep:include_dir"]
custom-protocol = ["tauri/custom-protocol"]

# 测试专用依赖：让 `cargo test`（默认 feature 集）可以无条件用 tempfile，
# 不必带 `--features cli`。release build 不受影响。
[dev-dependencies]
mockito = "1.7.2"
tempfile = "3"

[[bin]]
name = "rssh"
path = "src/main.rs"

[[bin]]
name = "rssh-cli"
path = "src/bin/rssh/main.rs"
required-features = ["cli"]

# NOTE: kept OUT of src/bin/ on purpose. The Tauri bundler auto-discovers every
# src/bin/<name> as an app binary (ignoring required-features) and would force the
# GUI build to copy a `rssh-server` it never builds. This binary is JetBrains-only
# (`cargo build --features server --bin rssh-server`).
[[bin]]
name = "rssh-server"
path = "src/server_main.rs"
required-features = ["server"]

# ── OHOS fork replacement (feat/ohos-port) ──
# HarmonyOS is not an official Tauri platform. This swaps the whole tauri
# stack for the `feat/open-harmony` branches (tauri fork based on 2.11.5,
# wry/tao branches upstream). Exact revs, not branches — PoC builds must be
# reproducible. Affects every target of this branch's builds (desktop
# included); the fork differs from 2.11.5 only by ohos support.
[patch.crates-io]
tauri = { git = "https://github.com/yangyongzhen/tauri", rev = "e3bf6eb168bacc7bb5c8c32d923bb8beaf77c92b" }
tauri-build = { git = "https://github.com/yangyongzhen/tauri", rev = "e3bf6eb168bacc7bb5c8c32d923bb8beaf77c92b" }
tauri-macros = { git = "https://github.com/yangyongzhen/tauri", rev = "e3bf6eb168bacc7bb5c8c32d923bb8beaf77c92b" }
tauri-codegen = { git = "https://github.com/yangyongzhen/tauri", rev = "e3bf6eb168bacc7bb5c8c32d923bb8beaf77c92b" }
tauri-utils = { git = "https://github.com/yangyongzhen/tauri", rev = "e3bf6eb168bacc7bb5c8c32d923bb8beaf77c92b" }
tauri-runtime = { git = "https://github.com/yangyongzhen/tauri", rev = "e3bf6eb168bacc7bb5c8c32d923bb8beaf77c92b" }
tauri-runtime-wry = { git = "https://github.com/yangyongzhen/tauri", rev = "e3bf6eb168bacc7bb5c8c32d923bb8beaf77c92b" }
wry = { git = "https://github.com/tauri-apps/wry", rev = "6aaf4b84b6e420015c6a14f264f1c7399f150392" }
tao = { git = "https://github.com/tauri-apps/tao", rev = "813572fbe582005e2fb513458bc212842745ceab" }

# wry/tao's ohos branches depend on openharmony-ability via this git URL
# (default branch = refactored 1.0 beta, incompatible). Pin it to the
# 0.3-compatible fork. Cargo forbids same-URL-different-rev patches, hence
# the different git URL.
[patch."https://github.com/harmony-contrib/openharmony-ability.git"]
openharmony-ability = { git = "https://github.com/yangyongzhen/openharmony-ability", rev = "295a276a699ba2352addc69b8cacb6acd3be6ab1" }
openharmony-ability-derive = { git = "https://github.com/yangyongzhen/openharmony-ability", rev = "295a276a699ba2352addc69b8cacb6acd3be6ab1" }
