# Appended to a generated copy of ../Cargo.toml by scripts/prepare-ohos.mjs.
# All local paths are generated from sources.json and reviewed upstream patches.
[workspace]
resolver = "2"

[target.'cfg(target_env = "ohos")'.dependencies]
napi-derive-ohos = "=1.2.0"
napi-ohos = { version = "=1.2.0", features = ["napi8"] }
openharmony-ability = { path = "@OHOS_SOURCES@/ability/crates/ability" }
openharmony-ability-derive = { path = "@OHOS_SOURCES@/ability/crates/derive" }
openharmony-ability-plugin-app-control = { path = "@OHOS_SOURCES@/ability/crates/plugin-app-control" }
openharmony-ability-plugin-files = { path = "@OHOS_SOURCES@/ability/crates/plugin-files" }
openharmony-ability-plugin-permission = { path = "@OHOS_SOURCES@/ability/crates/plugin-permission" }
openharmony-ability-plugin-url = { path = "@OHOS_SOURCES@/ability/crates/plugin-url" }
openharmony-ability-plugin-webview = { path = "@OHOS_SOURCES@/ability/crates/plugin-webview" }
openharmony-ability-plugin-window = { path = "@OHOS_SOURCES@/ability/crates/plugin-window" }

# Cargo patches apply to the entire graph, including host build dependencies.
# Keep this table in the separate OHOS workspace.
[patch.crates-io]
tauri = { path = "@OHOS_SOURCES@/tauri/crates/tauri" }
tauri-build = { path = "@OHOS_SOURCES@/tauri/crates/tauri-build" }
tauri-macros = { path = "@OHOS_SOURCES@/tauri/crates/tauri-macros" }
tauri-codegen = { path = "@OHOS_SOURCES@/tauri/crates/tauri-codegen" }
tauri-utils = { path = "@OHOS_SOURCES@/tauri/crates/tauri-utils" }
tauri-runtime = { path = "@OHOS_SOURCES@/tauri/crates/tauri-runtime" }
tauri-runtime-wry = { path = "@OHOS_SOURCES@/tauri/crates/tauri-runtime-wry" }
wry = { path = "@OHOS_SOURCES@/wry" }
tao = { path = "@OHOS_SOURCES@/tao" }
