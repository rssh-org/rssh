name: Release Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0). Leave empty to use the version already in package.json.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Tests (gate for all build jobs) ──────────────────────────────
  # 跑一次 ubuntu 即可：测试是平台无关的纯函数 + 协议解析。
  # build-desktop / build-android 都 needs: test —— 失败时不浪费 runner。
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Workspace tests cover shared core, CLI and app; the Tauri adapter
      # check also needs the Linux desktop libraries.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: Frontend tests (vitest)
        run: npm test

      - name: Build preparation tests (node)
        run: npm run test:build

      - name: Prepare pinned OHOS framework sources
        run: node ohos/scripts/prepare-ohos-sources.mjs

      - name: OHOS framework tests (node)
        run: node --test --test-concurrency=2 ohos/framework/tests/*.test.mjs

      - name: Build frontend for embedded server
        run: npm run build

      - name: Backend tests (cargo)
        run: cargo test --workspace --all-features

      - name: OHOS native helper tests (host cargo)
        run: cargo test --manifest-path ohos/Cargo.toml --lib --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Check standalone CLI and headless server
        run: |
          cargo check -p rssh-cli
          cargo check -p rssh-app --no-default-features --features server --bin rssh-server
          for package in rssh-core rssh-cli rssh-app; do
            features=()
            if [ "$package" = rssh-app ]; then features=(--features server); fi
            dependencies=$(cargo tree -p "$package" --no-default-features --edges normal,build "${features[@]}")
            if grep -Eq '(^|[[:space:]])(tauri([-a-z]+)?|wry|tao) v' <<< "$dependencies"; then
              echo "Unexpected GUI dependency in $package" >&2
              exit 1
            fi
          done

  build-desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: macos-14
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev

      # Sync the frontend, Tauri configuration and all workspace packages.
      # Pattern lifted from release.yml
      # — Cargo.toml MUST be updated too, otherwise some bundle metadata
      # ends up at the stale version. Ephemeral: runner-only, no commit.
      - name: Sync version
        id: ver
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            # Reject anything that isn't a semver-shaped tag — input goes
            # straight into sed and $GITHUB_OUTPUT, so a stray newline /
            # slash / shell-meta would corrupt manifests or step outputs.
            if [[ ! "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.+-]+)?$ ]]; then
              echo "::error::Invalid version '$INPUT' — expected semver (e.g. 1.0.0 or 1.0.0-rc.1)"
              exit 1
            fi
            VERSION="$INPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" app/tauri.conf.json && rm -f app/tauri.conf.json.bak
          for manifest in app/Cargo.toml core/Cargo.toml cli/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$manifest" && rm -f "$manifest.bak"
          done
          echo "v=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build Tauri app
        run: npm run tauri -- build --target ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}

      # linuxdeploy bakes .DirIcon as an absolute symlink into the runner's
      # build path (/home/runner/work/...), which breaks AppImage unpackers
      # like AppManager ("Symlink target not found"). Make it relative. (#91)
      - name: Fix AppImage icon symlink
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          APPIMAGE="$(ls "${BUNDLE}"/appimage/*.AppImage 2>/dev/null | head -1 || true)"
          [ -n "$APPIMAGE" ] && bash .github/scripts/fix-appimage-icon.sh "$APPIMAGE" || echo "No AppImage; skipping."

      # Rename to the same `rssh-<version>-<os>-<arch>.<ext>` convention as
      # release.yml so users get identical filenames whether they grab a
      # pre-release or a final release.
      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.v }}"
          PREFIX="rssh-${VERSION}-${{ matrix.name }}"
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          for f in "${BUNDLE}"/dmg/*.dmg;             do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.dmg";       done
          for f in "${BUNDLE}"/deb/*.deb;             do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.deb";       done
          for f in "${BUNDLE}"/rpm/*.rpm;             do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.rpm";       done
          for f in "${BUNDLE}"/appimage/*.AppImage;   do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.AppImage";  done
          for f in "${BUNDLE}"/msi/*.msi;             do [ -f "$f" ] && cp "$f" "dist/${PREFIX}.msi";       done
          for f in "${BUNDLE}"/nsis/*-setup.exe;      do [ -f "$f" ] && cp "$f" "dist/${PREFIX}-setup.exe"; done
          ls -lh dist/

      # 解压即可用版：跟 release.yml 同一步，pre-release 也产出免安装 zip。
      # 唯一差异是版本号来源（steps.ver.outputs.v，而非 release 的 tag）。
      # 文件名用 matrix.name（windows-x86_64）跟上面 Rename 一致，产出
      # rssh-<ver>-windows-x86_64-portable.zip，与正式 release 完全同名。
      - name: Build Windows portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.v }}"
          PORTABLE="rssh-${VERSION}-${{ matrix.name }}-portable"
          REL="target/${{ matrix.target }}/release"
          mkdir -p "${PORTABLE}"
          cp "${REL}/rssh.exe" "${PORTABLE}/"
          cp "${REL}/rssh-cli.exe" "${PORTABLE}/"
          cat > "${PORTABLE}/README.txt" <<'EOF'
          RSSH portable for Windows x86_64
          --------------------------------
          Just unzip and run rssh.exe — no installation needed.
          rssh-cli.exe is the CLI binary; add this folder to PATH if you want
          to use `rssh` from any terminal.

          WebView2 Runtime requirement:
            - Windows 11 / Windows 10 1803+ : built-in, ready to go.
            - Older / stripped Windows      : install WebView2 Runtime first:
              https://developer.microsoft.com/microsoft-edge/webview2/

          User data is stored under %USERPROFILE%\.rssh (same as installed
          builds — portable here means "no installer", not "fully isolated").
          EOF
          7z a "dist/${PORTABLE}.zip" "${PORTABLE}/"
          ls -lh dist/

      # ── JetBrains plugin (per-OS: bundles THIS target's rssh-server) ──
      # The plugin embeds a native rssh-server, so one zip is platform-specific;
      # each matrix leg produces rssh-<ver>-<os-arch>-jetbrains-plugin.zip.
      # CI has no local IDE, so build.gradle downloads the 2024.2 SDK (the
      # sinceBuild floor, JBR 21) via -PrsshIdeVersion.
      - name: Set up JDK 21 (JetBrains plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build rssh-server (for plugin)
        run: cargo build --release -p rssh-app --features server --bin rssh-server --target ${{ matrix.target }}

      - name: Build JetBrains plugin
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.v }}"
          BIN="rssh-server"
          [[ "${{ matrix.target }}" == *windows* ]] && BIN="rssh-server.exe"
          SRV="$(pwd)/target/${{ matrix.target }}/release/${BIN}"
          chmod +x idea-plugin/gradlew || true
          (cd idea-plugin && ./gradlew --no-daemon clean buildPlugin \
            -PrsshIdeVersion=2024.2 \
            -PrsshServerBin="${SRV}" \
            -PpluginVersion="${VERSION}")
          mkdir -p dist
          cp idea-plugin/build/distributions/*.zip \
            "dist/rssh-${VERSION}-${{ matrix.name }}-jetbrains-plugin.zip"
          ls -lh dist/

      - name: Upload to pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: v${{ steps.ver.outputs.v }}
          name: "RSSH v${{ steps.ver.outputs.v }} Beta"
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # setup-android doesn't export an NDK path, and `${{ env.* }}` can't see the
      # runner image's default ANDROID_NDK_* vars — so point NDK_HOME at the
      # runner's pre-installed NDK explicitly (this is what `tauri android` reads).
      - name: Point NDK_HOME at the runner NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:?NDK not found on runner}" >> "$GITHUB_ENV"

      - name: Install Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi

      # Same as desktop job, but Linux runner so plain `sed -i` (no .bak).
      - name: Sync version
        id: ver
        shell: bash
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            # Reject anything that isn't a semver-shaped tag — input goes
            # straight into sed and $GITHUB_OUTPUT, so a stray newline /
            # slash / shell-meta would corrupt manifests or step outputs.
            if [[ ! "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.+-]+)?$ ]]; then
              echo "::error::Invalid version '$INPUT' — expected semver (e.g. 1.0.0 or 1.0.0-rc.1)"
              exit 1
            fi
            VERSION="$INPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" app/tauri.conf.json
          for manifest in app/Cargo.toml core/Cargo.toml cli/Cargo.toml; do
            sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" "$manifest"
          done
          echo "v=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/key.properties

      # Two invocations: plain --apk builds the universal APK (all 4 ABIs,
      # incl. x86 emulators); --split-per-abi replaces that output with one
      # APK per requested target, so it must be a second run. The arm64 leg
      # reuses the cargo cache from the universal build — only repackaging.
      - name: Build Android APK (universal)
        run: npm run tauri -- android build --apk

      - name: Build Android APK (arm64 split)
        run: npm run tauri -- android build --apk --split-per-abi --target aarch64

      - name: Rename APKs
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.v }}"
          mkdir -p dist
          APK_ROOT=app/gen/android/app/build/outputs/apk
          UNIVERSAL=$(find "$APK_ROOT/universal" -name '*.apk' -type f | head -1)
          ARM64=$(find "$APK_ROOT/arm64" -name '*.apk' -type f | head -1)
          cp "$UNIVERSAL" "dist/rssh-${VERSION}-android-universal.apk"
          cp "$ARM64" "dist/rssh-${VERSION}-android-arm64.apk"
          ls -lh dist/

      - name: Upload to pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: v${{ steps.ver.outputs.v }}
          name: "RSSH v${{ steps.ver.outputs.v }} Beta"
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
