name: Tests

# Full test suite on every PR update targeting main. release.yml runs the
# same suite but only on version tags — before this file, PRs carried no
# checks at all, which is how a red test merged unnoticed (#253).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Read-only: this workflow never pushes artifacts.
permissions:
  contents: read

# A newer push to the same PR supersedes the previous run — cancel it
# instead of burning runner minutes on an outdated head.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-mcp:
    # Named pipes need a native Windows runner; the Unix suite cannot exercise
    # instance replacement, concurrent clients, or pending-read cancellation.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Native MCP transport and framing tests
        run: cargo test -p rssh-core mcp_control

      - name: MCP CLI protocol tests
        run: cargo test -p rssh-cli mcp

      - run: npm ci

      - name: Build frontend for embedded server
        run: npm run build

      - name: MCP host and lifecycle tests
        run: cargo test -p rssh-app --no-default-features --features server --lib mcp

      - name: Headless owner control integration
        run: cargo test -p rssh-app --no-default-features --features server --lib cli_control_tracks_the_existing_headless_connection_owner

  test:
    # Same recipe as release.yml's test job (proven there on tag builds):
    # full shared suite on Linux; native named-pipe coverage runs above.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Shared core tests exercise desktop transports and secret storage.
      # Keep desktop dependencies available for the Tauri adapter check too.
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - name: Frontend tests (vitest)
        run: npm test

      - name: Build preparation tests (node)
        run: npm run test:build

      - name: Prepare pinned OHOS framework sources
        run: node ohos/scripts/prepare-ohos-sources.mjs

      - name: OHOS framework tests (node)
        run: node --test --test-concurrency=2 ohos/framework/tests/*.test.mjs

      - name: Build frontend for embedded server
        run: npm run build

      - name: Backend tests (cargo)
        run: cargo test --workspace --all-features

      - name: OHOS native helper tests (host cargo)
        run: cargo test --manifest-path ohos/Cargo.toml --lib --locked
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Check standalone CLI and headless server
        run: |
          cargo check -p rssh-cli
          cargo check -p rssh-app --no-default-features --features server --bin rssh-server
          for package in rssh-core rssh-cli rssh-app; do
            features=()
            if [ "$package" = rssh-app ]; then features=(--features server); fi
            dependencies=$(cargo tree -p "$package" --no-default-features --edges normal,build "${features[@]}")
            if grep -Eq '(^|[[:space:]])(tauri([-a-z]+)?|wry|tao) v' <<< "$dependencies"; then
              echo "Unexpected GUI dependency in $package" >&2
              exit 1
            fi
          done
